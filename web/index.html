``<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Grades Tracker - Simple Web</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Grades Tracker</h1>

    <div id="auth" class="card">
      <div class="tabs">
        <button id="tab-login" class="tab active">Login</button>
        <button id="tab-register" class="tab">Register</button>
      </div>

      <div id="login-panel" class="panel">
        <div class="field">
          <label>Name</label>
          <input id="login-name" type="text" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="login-password" type="password" />
        </div>
        <div class="actions">
          <button id="btn-login">Login</button>
        </div>
        <div id="login-msg" class="msg"></div>
      </div>

      <div id="register-panel" class="panel hidden">
        <div class="field">
          <label>Name</label>
          <input id="reg-name" type="text" />
        </div>
        <div class="field">
          <label>Role</label>
          <div class="radio-row">
            <label><input name="role" type="radio" value="student" /> Student</label>
            <label><input name="role" type="radio" value="teacher" /> Teacher</label>
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <input id="reg-password" type="password" />
        </div>
        <div class="actions">
          <button id="btn-register">Register</button>
        </div>
        <div id="reg-msg" class="msg"></div>
      </div>
    </div>

    <div id="app" class="card hidden">
      <div class="topbar">
        <div id="welcome"></div>
        <div>
          <button id="btn-logout">Logout</button>
        </div>
      </div>

      <div id="controls" class="controls">
        <div id="teacher-controls" class="ctrl hidden">
          <h3>Add Grade</h3>
          <div class="field">
            <label>Student name</label>
            <input id="grade-student" type="text" />
          </div>
          <div class="field">
            <label>Course</label>
            <input id="grade-course" type="text" />
          </div>
          <div class="field">
            <label>Value</label>
            <input id="grade-value" type="number" step="0.1" min="2" max="6" />
          </div>
          <div class="actions">
            <button id="btn-add-grade">Add Grade</button>
          </div>
          <div id="addgrade-msg" class="msg"></div>
        </div>

        <div>
          <h3>Search Grades</h3>
          <div class="field">
            <label>Student contains</label>
            <input id="search-student" type="text" />
          </div>
          <div class="field">
            <label>Course contains</label>
            <input id="search-course" type="text" />
          </div>
          <div class="actions">
            <button id="btn-search">Search</button>
            <button id="btn-list-all">List All</button>
          </div>
        </div>
      </div>

      <div id="results" class="results">
        <h3>Results</h3>
        <div id="results-area"></div>
      </div>

      <div id="averages" class="results">
        <h3>Averages per course</h3>
        <div id="averages-area"></div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>``
